name: CI Pipeline

# Deploys are handled natively: Railway auto-deploys `backend` on push (its own GitHub
# integration), Vercel auto-deploys the frontend on push (its own GitHub integration).
# This workflow is CI only — it gates pull requests and pushes on tests actually passing.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-test:
    name: Backend — Maven Test + JaCoCo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests + JaCoCo gate
        run: ./mvnw verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  frontend-build:
    name: Frontend — Vitest + Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

  repo-hygiene:
    name: Repo Hygiene — Verify no secrets tracked
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for tracked secret files or build artifacts
        run: |
          set -e
          VIOLATIONS=0

          for f in $(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.local$|(^|/)\.env\.production$' || true); do
            echo "::error::Secret file tracked in git: $f"
            VIOLATIONS=1
          done

          if git ls-files | grep -q '^target/'; then
            echo "::error::Maven build output target/ is tracked in git"
            VIOLATIONS=1
          fi

          if git ls-files | grep -q '^frontend/node_modules/'; then
            echo "::error::frontend/node_modules is tracked in git"
            VIOLATIONS=1
          fi

          if git ls-files | grep -q '^frontend/\.next/'; then
            echo "::error::frontend/.next build output is tracked in git"
            VIOLATIONS=1
          fi

          if [ "$VIOLATIONS" -eq 1 ]; then
            exit 1
          fi
          echo "Repo hygiene check passed — no secrets or build artifacts tracked"
