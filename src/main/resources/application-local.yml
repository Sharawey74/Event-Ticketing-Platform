server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing_db
    username: ticketing
    password: ticketing
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: ticketing
    password: ticketing
    listener:
      simple:
        # Fix 26-dlq. The DLQs in RabbitMQConfig were declared and bound but unreachable:
        # dead-lettering only happens when a message is rejected WITHOUT requeue, and Spring
        # Boot defaults to default-requeue-rejected=true with retry disabled. A listener that
        # threw was therefore requeued immediately and forever -- a hot loop that burns CPU,
        # blocks the queue head and floods the logs, instead of parking one message in a DLQ.
        #
        # default-requeue-rejected: false is the load-bearing line. Without it the retry block
        # alone still ends in an infinite requeue once the attempts are exhausted.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3          # 1 initial delivery + 2 retries
          initial-interval: 3000   # 3s, then 6s (multiplier below)
          multiplier: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    root: WARN
    com.ticketing: DEBUG

jwt:
  secret: ${JWT_SECRET:ZmFrZS1qc3ctc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2LTAwMDAwMDAwMDA=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

frontend:
  url: ${FRONTEND_URL:https://ticketing-platform.vercel.app}

stripe:
  public-key: ${STRIPE_PUBLIC_KEY:pk_test_placeholder}
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  success-url: http://localhost:3000/bookings/{bookingId}/confirmation?session_id={CHECKOUT_SESSION_ID}
  cancel-url: http://localhost:3000/dashboard/bookings
