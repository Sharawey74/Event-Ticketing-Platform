server:
  port: 8088
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-test-query: SELECT 1
  data:
    redis:
      url: ${REDIS_URL}
  rabbitmq:
    uri: ${RABBITMQ_URL}
    listener:
      simple:
        # Fix 26-dlq. The DLQs in RabbitMQConfig were declared and bound but unreachable:
        # dead-lettering only happens when a message is rejected WITHOUT requeue, and Spring
        # Boot defaults to default-requeue-rejected=true with retry disabled. A listener that
        # threw was therefore requeued immediately and forever -- a hot loop that burns CPU,
        # blocks the queue head and floods the logs, instead of parking one message in a DLQ.
        #
        # default-requeue-rejected: false is the load-bearing line. Without it the retry block
        # alone still ends in an infinite requeue once the attempts are exhausted.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3          # 1 initial delivery + 2 retries
          initial-interval: 3000   # 3s, then 6s (multiplier below)
          multiplier: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  rate-limit:
    enabled: true # Fix M-002 — disabled everywhere else (local/tests default to false)

frontend:
  url: ${FRONTEND_URL}

stripe:
  public-key: ${STRIPE_PUBLIC_KEY}
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  success-url: ${FRONTEND_URL}/bookings/{bookingId}/confirmation?session_id={CHECKOUT_SESSION_ID}
  cancel-url: ${FRONTEND_URL}/dashboard/bookings

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: false  # RabbitMQ powers async notifications only — must not gate the web service's healthcheck
    mail:
      enabled: false  # SMTP is not configured in production yet — must not gate the web service's healthcheck

logging:
  level:
    root: INFO
    com.ticketing: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    com.zaxxer.hikari: WARN
