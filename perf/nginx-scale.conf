# Load balancer for the scalability harness.
#
# THE GOTCHA THIS FILE EXISTS TO AVOID
# ------------------------------------
# The obvious config is an upstream block:
#
#     upstream backend { server app:8088; }
#     location / { proxy_pass http://backend; }
#
# That silently breaks the whole experiment. nginx resolves upstream hostnames ONCE at startup
# and caches the result forever. Docker's embedded DNS returns all replica IPs for `app`, but
# nginx keeps only the first — so `--scale app=4` sends 100% of traffic to replica 1 while the
# other three sit idle. You would measure "4 replicas are no faster than 1" and conclude the app
# does not scale, when in fact you never load-balanced anything.
#
# The fix is two things: an explicit `resolver` pointing at Docker's embedded DNS (always
# 127.0.0.11), and a proxy_pass through a VARIABLE. The variable forces nginx to re-resolve per
# request instead of at config-load time, so it sees every replica and round-robins across them.
#
# KNOWN TRADE-OFF, ACCEPTED DELIBERATELY
# --------------------------------------
# Variable proxy_pass and upstream keepalive are mutually exclusive in open-source nginx —
# keepalive requires a static `upstream` block, which is exactly what re-resolution rules out.
# (Re-resolving a named upstream is an nginx Plus feature.) So every proxied request opens a
# fresh TCP connection to a backend.
#
# That costs absolute throughput. It does NOT invalidate this harness, because the overhead is
# identical at 1, 2 and 4 replicas — it cancels out of the SCALING FACTOR, which is the only
# number this experiment is for. Do not quote absolute req/s measured through this proxy.

events {
    worker_connections 4096;
}

http {
    access_log off;                  # measurement run: log I/O is avoidable noise
    error_log /dev/stderr warn;

    server {
        listen 8088;

        # Docker's embedded DNS. valid=5s picks up replicas added or removed mid-run.
        resolver 127.0.0.11 valid=5s ipv6=off;

        location / {
            # The variable is load-bearing — see the header comment.
            set $backend "http://app:8088";
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Generous on purpose. The point is to observe the app degrading, not to have the
            # proxy cut it off early and report its own timeout as the application's failure.
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}
